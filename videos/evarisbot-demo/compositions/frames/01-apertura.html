    <script>
      (function () {
        var FRAME_ID = "01-apertura";

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines[FRAME_ID] = tl;

        var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
        if (!root) return;

        function el(name) {
          return root.querySelector('[data-el="' + name + '"]');
        }

        var lockup = el("lockup");
        var nameStack = el("name-stack");
        var nameBase = el("name-base");
        var nameSheen = el("name-sheen");
        var ruleSvg = el("rule");
        var rulePath = el("rule-path");
        var hospital = el("hospital");
        var tagline = el("tagline");

        /* ---------- Scene 1 (0.0-1.6s) — "Evarisbot" + gradient-text-sweep ---------- */

        // Hero is on screen well before 0.5s; entrance is a fromTo, never a CSS-hidden state.
        tl.fromTo(
          nameStack,
          { opacity: 0, scale: 0.982 },
          { opacity: 1, scale: 1, duration: 0.62, ease: "power2.out" },
          0.05
        );

        // One-pass sheen INSIDE the letterforms. background-size is 300% (>100%) so the
        // position tween actually travels; 100% -> 0% reads left-to-right; ease "none"
        // so it reads as light rather than as a moving object.
        tl.fromTo(
          nameSheen,
          { backgroundPosition: "100% 50%" },
          { backgroundPosition: "0% 50%", duration: 1.15, ease: "none" },
          0.28
        );

        // The sweep resolves: the base copy settles from 86% to full white behind it.
        tl.to(
          nameBase,
          { color: "rgb(255, 255, 255)", duration: 0.4, ease: "power1.out" },
          1.35
        );

        /* ---------- Scene 2 (1.6-2.8s) — svg-path-draw rule, then the institution ---------- */

        var len = 480;
        if (rulePath && typeof rulePath.getTotalLength === "function") {
          var measured = rulePath.getTotalLength();
          if (measured > 0) len = measured;
        }
        rulePath.style.strokeDasharray = String(len);
        rulePath.style.strokeDashoffset = String(len);

        tl.to(rulePath, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.6);

        // The wordmark's companion line fades in only after the stroke settles (+ a beat).
        tl.fromTo(
          hospital,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          2.2
        );

        /* ---------- Scene 3 (2.8-4.2s) — the block yields, the framing line arrives ---------- */

        // Layout resolves to rule-of-thirds: the lockup rises, the tagline takes the lower third.
        tl.fromTo(
          lockup,
          { y: 0 },
          { y: -70, duration: 0.95, ease: "power3.out" },
          2.8
        );

        tl.fromTo(
          tagline,
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
          3.05
        );

        /* ---------- Scene 4 (4.2-5.0s) — allocated stillness; only the rule breathes ---------- */

        tl.fromTo(
          ruleSvg,
          { opacity: 0.4 },
          { opacity: 0.55, duration: 0.8, ease: "sine.inOut" },
          4.2
        );
      })();
