      var groundBlue = one(".f08cierre-ground-blue");

      var rings = all(".f08cierre-ring");
      var lockup = one(".f08cierre-lockup");
      var wordmark = one(".f08cierre-wordmark");
      var rule = one(".f08cierre-rule");
      var hospital = all(".f08cierre-hospital span");
      var lema = one(".f08cierre-lema");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Escena 1 (0.0–1.2s) — center-outward-expansion ──────────────────

         acorde. Al compartir el driver, los anillos van siempre por dentro
         del borde azul, así que nunca se ven sobre el blanco.               */

      var FLOOD_EASE = "power3.out";

      tl.fromTo(
        disc,
        { scale: 0.02 },
        { scale: 1, duration: FLOOD_DUR, ease: FLOOD_EASE },
        0,
      );

      rings.forEach(function (ring) {
        tl.fromTo(
          ring,
          { scale: 0.02, opacity: 0.09 },
          { scale: 1, opacity: 0.09, duration: FLOOD_DUR, ease: FLOOD_EASE },
          0,
        );
      });

      // el suelo azul se arma bajo el disco ya cerrado (cambio imperceptible)

        groundBlue,
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "none" },
        1.0,
      );

      // los anillos se retiran a un susurro y sostienen detrás del lockup

      /* ── Escena 2 (1.2–2.4s) — "Evarisbot" ───────────────────────────── */

        wordmark,
        { opacity: 0, y: 38, scale: 0.982 },
        { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        1.1,

      /* ── Escena 3 (2.4–3.6s) — línea fina + hospital ─────────────────── */

        rule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.62, ease: "power2.out" },
        2.35,
      );

        hospital,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", stagger: 0.07 },
        2.72,

        { backgroundPosition: "0% 50%", duration: 1.25, ease: "none" },
