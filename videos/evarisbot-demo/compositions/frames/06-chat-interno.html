  <script>
    (function () {
      var gsapLib = window.gsap;
      window.__timelines = window.__timelines || {};
      var tl = gsapLib.timeline({ paused: true });
      window.__timelines["06-chat-interno"] = tl;

      /* ---------------------------------------------------------------
         Scene 1 (0.0–1.5s) — solo el rótulo, centrado en el lienzo.
         Autoría en tamaño "docked" (36px, centro y≈90); el héroe es el
         mismo bloque escalado 1.55 y trasladado al centro (y +450).
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f06-rotulo",
        { opacity: 0, y: 468, scale: 1.55 },
        { opacity: 1, y: 450, scale: 1.55, duration: 0.68, ease: "power3.out" },
        0.08,
      );

      /* ---------------------------------------------------------------
         Scene 2 (1.5–2.2s) — el rótulo encoge ~35% y sube a cabecera
         (movimiento firma del blueprint); entra la superficie del chat.
      --------------------------------------------------------------- */
      tl.to("#f06-rotulo", { y: 0, scale: 1, duration: 0.78, ease: "power3.inOut" }, 1.45);

      tl.fromTo(
        "#f06-surface",
        { opacity: 0, y: 40, scale: 0.965 },
        { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" },
        1.55,
      );

      /* ---------------------------------------------------------------
         Scene 3 (2.2–3.4s) — burbuja de Ana (spring-pop-entrance,
         origen anclado a su esquina: emerge de su lado del hilo).
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f06-b1",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        2.25,
      );

      /* ---------------------------------------------------------------
         Scene 4 (3.4–4.8s) — "escribiendo…" en la cabecera
         (discrete-text-sequence) y luego la burbuja de Camilo.
      --------------------------------------------------------------- */
      var IDLE = "Equipo de atención · 2 en línea";
      var SUB = [
        { t: 0.0, text: IDLE },
        { t: 2.95, text: "Camilo está escribiendo" },
        { t: 3.08, text: "Camilo está escribiendo." },
        { t: 3.2, text: "Camilo está escribiendo.." },
        { t: 3.32, text: "Camilo está escribiendo..." },
        { t: 3.5, text: IDLE },
      ];
      var subEl = document.getElementById("f06-hsub");

      function subAt(time) {
        for (var i = SUB.length - 1; i >= 0; i--) {
          if (time >= SUB[i].t) return SUB[i].text;
        }
        return IDLE;
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 7,
          duration: 7,
          ease: "none",
          onUpdate: function () {
            var next = subAt(driver.t);
            if (subEl && subEl.textContent !== next) subEl.textContent = next;
          },
        },
        0,
      );

      tl.fromTo(
        "#f06-b2",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        3.45,
      );

      /* ---------------------------------------------------------------
         Scene 5 (4.8–5.8s) — el visto: doble check azul que se dibuja
         + "Visto por Ana". La ÚNICA move de cámara acompaña el momento.
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f06-cam",
        { scale: 1, y: 0 },
        { scale: 1.042, y: -12, duration: 1.3, ease: "power2.out" },
        4.7,
      );

      tl.fromTo(
        "#f06-receipt",
        { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
        4.85,
      );

      tl.fromTo(
        "#f06-ck1",
        { strokeDashoffset: 26 },
        { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
        4.96,

        { strokeDashoffset: 26 },
        { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
        5.09,
      );

         Scene 6 (5.8–7.0s) — quieto, respirando: deriva mínima de la
         cámara ya asentada. Sin salidas (el corte raíz es la salida).
