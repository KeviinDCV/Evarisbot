  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* --------------------------------------------------------------

      -------------------------------------------------------------- */
      tl.set("#f03-cursor", { x: 1992, y: 618 }, 0);
      tl.set("#f03-progress", { scaleX: 0 }, 0);

      /* ==============================================================

      ============================================================== */
      tl.fromTo("#f03-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.10);

      // waterfall-entry · opacidad BINARIA via tl.set, whip desde abajo

        { id: "#f03-w1", t: 0.180, d: 0.190, y: 76 },
        { id: "#f03-w2", t: 0.403, d: 0.160, y: 52 },

        { id: "#f03-w5", t: 0.868, d: 0.145, y: 46 },
        { id: "#f03-w6", t: 0.996, d: 0.140, y: 44 },
        { id: "#f03-w7", t: 1.103, d: 0.135, y: 42 },
        { id: "#f03-w8", t: 1.205, d: 0.130, y: 48 }

      for (var i = 0; i < words.length; i++) {
        tl.set(words[i].id, { opacity: 1, y: words[i].y }, words[i].t);
        tl.to(words[i].id, { y: 0, duration: words[i].d, ease: "power4.out" }, words[i].t);
      }

      /* ==============================================================
         ESCENA 2 (1.8-3.0) · el rotulo sube · pantalla partida 60/40
      ============================================================== */
      tl.to("#f03-title", { y: 0, scale: 1, duration: 0.78, ease: "power3.inOut" }, 1.80);

      // camara: UN solo movimiento lento (zoom-out) durante toda la demo,
      // manteniendo panel y movil siempre co-visibles
      tl.fromTo("#f03-world",
        { scale: 1.018 },
        { scale: 1, duration: 11.6, ease: "none" }, 2.20);

      tl.fromTo("#f03-panel",
        { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 2.06);

      tl.fromTo("#f03-phone",
        { opacity: 0, y: 44, scale: 0.965 },
        { opacity: 1, y: 0, scale: 1, duration: 0.70, ease: "power3.out" }, 2.20);

      tl.fromTo("#f03-panelhead",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 2.62);

      tl.fromTo("#f03-drop",
        { opacity: 0, scale: 0.975 },
        { opacity: 1, scale: 1, duration: 0.46, ease: "power3.out" }, 2.74);

      tl.fromTo("#f03-thead",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 2.90);

      /* ==============================================================
         ESCENA 3 (3.0-4.6) · cae "agenda-29-julio.xlsx"
         physics-press-reaction · archivo y zona comprimen JUNTOS
      ============================================================== */
      // cae desde justo encima del panel (nunca invade el rotulo de cabecera)
      tl.set("#f03-file", { opacity: 1, y: -132, rotation: -5, scale: 0.96 }, 3.08);
      tl.to("#f03-file",
        { y: 0, rotation: 0, scale: 1, duration: 0.50, ease: "power2.in" }, 3.08);

      // impacto (un solo targets array, misma escala)
      tl.to(["#f03-file", "#f03-drop"],
        { scale: 0.955, duration: 0.11, ease: "power1.in" }, 3.58);
      tl.to("#f03-dropglow",
        { opacity: 1, duration: 0.11, ease: "power1.in" }, 3.58);

      // liberacion con rebote
      tl.to(["#f03-file", "#f03-drop"],
        { scale: 1, duration: 0.54, ease: "back.out(1.9)" }, 3.69);
      tl.to("#f03-dropglow",
        { opacity: 0, duration: 0.5, ease: "power2.out" }, 3.69);

      // la zona acepta el archivo
      tl.to("#f03-dropghost", { opacity: 0, duration: 0.26, ease: "power2.out" }, 3.62);
      tl.to("#f03-drop", { backgroundColor: "rgba(46,63,132,0.09)", duration: 0.42, ease: "power2.out" }, 3.62);

      // se procesa solo
      tl.to("#f03-progress", { scaleX: 1, duration: 0.46, ease: "power2.inOut" }, 4.02);
      tl.fromTo("#f03-filecheck",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2)" }, 4.50);

      /* ==============================================================
         ESCENA 4 (4.6-7.0) · la tabla se rellena sola · waterfall-entry
      ============================================================== */
      var rows = [
        { id: "#f03-row1", t: 4.660, d: 0.190, y: 72 },
        { id: "#f03-row2", t: 4.883, d: 0.170, y: 56 },
        { id: "#f03-row3", t: 5.070, d: 0.160, y: 50 },
        { id: "#f03-row4", t: 5.230, d: 0.155, y: 48 },
        { id: "#f03-row5", t: 5.368, d: 0.150, y: 44 },
        { id: "#f03-row6", t: 5.485, d: 0.140, y: 42 }
      ];
      for (var r = 0; r < rows.length; r++) {
        tl.set(rows[r].id, { opacity: 1, y: rows[r].y }, rows[r].t);
        tl.to(rows[r].id, { y: 0, duration: rows[r].d, ease: "power4.out" }, rows[r].t);
      }

      // columna Estado: las seis en "Pendiente", gris
      var pend = ["#f03-b1", "#f03-b2", "#f03-bpend", "#f03-b4", "#f03-b5", "#f03-b6"];
      for (var p = 0; p < pend.length; p++) {
        tl.fromTo(pend[p],
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.7)" }, 5.76 + p * 0.115);
      }

      tl.to("#f03-chipB",
        { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.8)" }, 6.70);

      /* ==============================================================
         ESCENA 5 (7.0-9.2) · llega el recordatorio al movil
      ============================================================== */
      tl.fromTo("#f03-datechip",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 7.04);

      tl.fromTo("#f03-bubble",
        { opacity: 0, y: 26, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.50, ease: "back.out(1.3)" }, 7.16);

      tl.fromTo("#f03-greet",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.30, ease: "power3.out" }, 7.44);
      tl.fromTo("#f03-lead",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.30, ease: "power3.out" }, 7.56);

      var det = ["#f03-d1", "#f03-d2", "#f03-d3", "#f03-d4", "#f03-d5"];
      for (var k = 0; k < det.length; k++) {
        tl.fromTo(det[k],
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.30, ease: "power3.out" }, 7.72 + k * 0.10);
      }

      tl.fromTo("#f03-btime",
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out" }, 8.36);

      tl.fromTo("#f03-btn-ok",
        { opacity: 0, y: 16, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, 8.52);
      tl.fromTo("#f03-btn-no",
        { opacity: 0, y: 16, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, 8.68);

      /* ==============================================================
         ESCENA 6 (9.2-10.6) · el paciente pulsa "Confirmar"
         physics-press-reaction - cursor + boton, un solo targets array
      ============================================================== */
      tl.to("#f03-cursor",
        { x: 1479, y: 707, duration: 1.04, ease: "power2.inOut" }, 9.18);

      tl.to(["#f03-btn-ok", "#f03-cursor"],
        { scale: 0.93, duration: 0.14, ease: "power1.in" }, 10.22);
      tl.to("#f03-okglow",
        { opacity: 1, duration: 0.14, ease: "power1.in" }, 10.22);

      tl.to(["#f03-btn-ok", "#f03-cursor"],
        { scale: 1, duration: 0.56, ease: "back.out(2)" }, 10.44);
      tl.to("#f03-okglow",
        { opacity: 0, duration: 0.5, ease: "power2.out" }, 10.44);

      // se ilumina en verde (verde = solo confirmacion)
      tl.to("#f03-btn-ok",
        { backgroundColor: "rgb(219,245,236)", color: "#059669", duration: 0.40, ease: "power2.out" }, 10.44);
      tl.fromTo("#f03-okcheck",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)" }, 10.56);

      /* ==============================================================
         ESCENA 7 (10.6-12.4) · LA CLAVE
         El vinculo viaja del movil a la tabla y la fila cambia sola:
         "Pendiente" gris -> "Confirmada" VERDE (scale-swap-transition).
         Nadie del hospital ha tocado nada.
      ============================================================== */
      tl.to("#f03-link", { opacity: 0.5, duration: 0.22, ease: "power2.out" }, 10.48);
      tl.to("#f03-linkpath", { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" }, 10.48);
      tl.fromTo("#f03-linkdot",
        { attr: { r: 0 } },
        { attr: { r: 5 }, duration: 0.30, ease: "back.out(2)" }, 10.86);

      // la fila destaca sobre las demas
      tl.to(["#f03-row1", "#f03-row2", "#f03-row4", "#f03-row5", "#f03-row6"],
        { opacity: 0.4, duration: 0.50, ease: "power2.out" }, 10.62);
      tl.fromTo("#f03-halo",
        { opacity: 0, scale: 0.98 },
        { opacity: 1, scale: 1.015, duration: 0.55, ease: "power3.out" }, 10.62);
      tl.to("#f03-row3",
        { scale: 1.015, duration: 0.55, ease: "power3.out" }, 10.62);

      // el swap: saliente rapido, entrante con rebote y por encima
      tl.to("#f03-bpend",
        { scale: 0.72, opacity: 0, duration: 0.34, ease: "power2.in" }, 10.78);
      tl.to("#f03-bconf",
        { scale: 1, opacity: 1, duration: 0.58, ease: "back.out(1.8)" }, 10.97);
      // el contenido interno se revela cuando el contenedor ya asento
      tl.fromTo("#f03-confcheck",
        { opacity: 0, x: -6 },
        { opacity: 1, x: 0, duration: 0.30, ease: "power3.out" }, 11.40);

      /* ==============================================================
         ESCENA 8 (12.4-14.0) · apoyo · todo lo demas, quieto
      ============================================================== */
      tl.fromTo("#f03-support",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 12.46);

      tl.to("#f03-noring",
        { opacity: 1, duration: 0.45, ease: "power2.out" }, 12.74);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-recordatorios"] = tl;
    })();
  </script>
