    <script>
      (function () {
        var FRAME_ID = "05-envios-masivos";
        var scope = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;
        var q = function (sel) {
          return scope.querySelector(sel);
        };

        var head = q("#em5-head");
        var card = q("#em5-card");
        var countEl = q("#em5-count");
        var countLine = q("#em5-count-line");
        var countLabel = q("#em5-count-label");
        var suffix = q("#em5-suffix");
        var pctEl = q("#em5-pct");
        var fill = q("#em5-fill");

        var steps = [q("#em5-step-1"), q("#em5-step-2"), q("#em5-step-3")];
        var badges = [q("#em5-badge-1"), q("#em5-badge-2"), q("#em5-badge-3")];
        var checks = [q("#em5-chk-1"), q("#em5-chk-2"), q("#em5-chk-3")];
        var conns = [q("#em5-conn-1"), q("#em5-conn-2")];
        var sup = [q("#em5-sup-1"), q("#em5-sup-2"), q("#em5-sup-3")];

        /* ---- deterministic start states (no CSS-hidden entrances, no transitions) ---- */
        gsap.set(fill, { scaleX: 0 });
        gsap.set(conns, { scaleX: 0 });
        var chkLen = checks.map(function (p) {
          var len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
          return len;
        });
        countEl.textContent = "0";
        pctEl.textContent = "0%";

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines[FRAME_ID] = tl;

        /* ================= Scene 1 (0.0–1.6) — solo el rótulo ================= */
        tl.fromTo(
          head,
          { opacity: 0, y: 386, scale: 1.55 },
          { opacity: 1, y: 354, scale: 1.55, duration: 0.7, ease: "power3.out" },
          0.04,
        );

        /* ========== Scene 2 (1.6–2.4) — rótulo a cabecera + entra la superficie ========== */
        tl.fromTo(
          head,
          { y: 354, scale: 1.55 },
          { y: 0, scale: 1, duration: 0.8, ease: "power3.inOut", immediateRender: false },
          1.56,
        );
        tl.fromTo(
          card,
          { opacity: 0, y: 46, scale: 0.975 },
          { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" },
          1.62,
        );

        /* ========== Scene 3 (2.4–4.8) — los pasos se encienden en orden ==========
           dynamic-content-sequencing: pre-computed state table + one linear driver;
           the DOM is written only on state transitions (seek-safe, no callbacks). */
        var STEP_STATES = [
          { t: 0.0, s: ["pending", "pending", "pending"] },
          { t: 2.4, s: ["active", "pending", "pending"] },
          { t: 3.1, s: ["done", "active", "pending"] },
          { t: 3.8, s: ["done", "done", "active"] },
          { t: 7.0, s: ["done", "done", "done"] },
        ];

        function stateAt(time) {
          for (var i = STEP_STATES.length - 1; i >= 0; i--) {
            if (time >= STEP_STATES[i].t) return STEP_STATES[i].s;
          }
          return STEP_STATES[0].s;
        }

        var driver = { t: 0 };
        var lastKey = "";
        tl.to(
          driver,
          {
            t: 9.5,
            duration: 9.5,
            ease: "none",
            onUpdate: function () {
              var s = stateAt(driver.t);
              var key = s.join("|");
              if (key === lastKey) return;
              lastKey = key;
              for (var i = 0; i < 3; i++) steps[i].setAttribute("data-state", s[i]);
            },
          },
          0,
        );

        /* badge scale bounce on each flip + checkmark draw-in on completion */
        var BOUNCE = [
          [badges[0], 2.4],
          [badges[0], 3.1],
          [badges[1], 3.1],
          [badges[1], 3.8],
          [badges[2], 3.8],
          [badges[2], 7.0],
        ];
        BOUNCE.forEach(function (b) {
          tl.fromTo(
            b[0],
            { scale: 0.78 },
            { scale: 1, duration: 0.5, ease: "back.out(2.2)" },
            b[1],
          );
        });

        [3.1, 3.8, 7.0].forEach(function (at, i) {
          tl.fromTo(
            checks[i],
            { strokeDashoffset: chkLen[i] },
            {
              strokeDashoffset: 0,
              duration: 0.34,
              ease: "power2.out",
              immediateRender: false,
            },
            at,
          );
        });

        tl.fromTo(conns[0], { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 3.14);
        tl.fromTo(conns[1], { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 3.84);

        /* ========== Scene 4 (4.8–7.2) — la barra corre y el contador cuenta ==========
           stat-bars-and-fills (scaleX from a left origin) + counting-dynamic-scale
           (proxy value + transform growth) sharing start, duration and ease. */
        tl.fromTo(
          [countLine, pctEl],
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          4.5,
        );

        var COUNT_AT = 4.8;
        var COUNT_DUR = 2.2;
        var COUNT_EASE = "power2.out";
        var TARGET = 217;

        var sent = { v: 0 };
        tl.to(
          sent,
          {
            v: TARGET,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: function () {
              countEl.textContent = String(Math.round(sent.v));
            },
          },
          COUNT_AT,
        );
        tl.fromTo(
          countEl,
          { scale: 0.56 },
          { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
          COUNT_AT,
        );

        var pct = { v: 0 };
        tl.to(
          pct,
          {
            v: 100,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: function () {
              pctEl.textContent = Math.round(pct.v) + "%";
            },
          },
          COUNT_AT,
        );

        tl.fromTo(
          fill,
          { scaleX: 0 },
          { scaleX: 1, duration: COUNT_DUR, ease: COUNT_EASE },
          COUNT_AT,
        );

        /* label arrives before the count peaks; the suffix lands after it */
        tl.fromTo(
          countLabel,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          COUNT_AT + 0.3,
        );
        tl.fromTo(
          suffix,
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
          COUNT_AT + COUNT_DUR,
        );

        /* one slow camera-ish push on the surface across the send (single move) */
        tl.fromTo(
          card,
          { scale: 1 },
          { scale: 1.02, duration: 4.2, ease: "sine.inOut", immediateRender: false },
          4.8,
        );

        /* ================= Scene 5 (7.2–9.0) — apoyo final ================= */
        sup.forEach(function (el, i) {
          tl.fromTo(
            el,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
            7.22 + i * 0.26,
          );
        });
      })();
    </script>
