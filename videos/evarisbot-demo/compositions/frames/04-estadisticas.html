  <script>
    (function () {
      var g = window.gsap;
      window.__timelines = window.__timelines || {};
      var tl = g.timeline({ paused: true });
      var F = 1 / 60;

      function q(sel) {
        return document.querySelector(sel);
      }

      /* — formateo español, determinista (sin toLocaleString/ICU) — */
      function miles(n) {
        var s = String(Math.round(n));
        var out = "";
        var c = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s.charAt(i) + out;
          c++;
          if (c % 3 === 0 && i > 0) out = "." + out;
        }
        return out;
      }
      function dec(n, d) {
        return n.toFixed(d).replace(".", ",");
      }

      /* ── Scene 1 (0.0–1.6s) — rótulo centrado, waterfall-entry ── */
      tl.set("#f04e-title", { y: 430, scale: 1.62 }, 0);

      var words = [
        { id: "#f04e-w1", y: 62, d: 0.16 },
        { id: "#f04e-w2", y: 56, d: 0.15 },
        { id: "#f04e-w3", y: 72, d: 0.18 },
        { id: "#f04e-w4", y: 44, d: 0.13 },
        { id: "#f04e-w5", y: 58, d: 0.15 },
        { id: "#f04e-w6", y: 74, d: 0.18 }
      ];
      var overlaps = [0, 1, 1, 2, 1, 2]; // frames de solape entre entradas
      var t = 0.05;
      for (var w = 0; w < words.length; w++) {
        if (w > 0) t = t + words[w - 1].d - overlaps[w] * F;
        tl.set(words[w].id, { opacity: 1, y: words[w].y }, t);
        tl.to(words[w].id, { y: 0, duration: words[w].d, ease: "power4.out" }, t);
      }

      /* ── Scene 2 (1.6–2.6s) — rótulo a cabecera + entra la superficie ── */
      tl.to("#f04e-title", { y: 0, scale: 1, duration: 0.75, ease: "power3.inOut" }, 1.6);

      tl.fromTo(
        "#f04e-panel",
        { opacity: 0, y: 46, scale: 0.975 },
        { opacity: 1, y: 0, scale: 1, duration: 0.68, ease: "power3.out" },
        1.95
      );

      /* deriva de cámara — muy lenta, continua, sin destellos */
      tl.to("#f04e-camera", { scale: 1.016, duration: 7.95, ease: "none" }, 1.95);

      /* ── Scene 3 (2.6–5.2s) — 4 tarjetas (waterfall-entry, 120 ms) + conteo ── */
      var cards = [
        { id: "#f04e-card-1", y: 76, d: 0.3 },
        { id: "#f04e-card-2", y: 68, d: 0.28 },
        { id: "#f04e-card-3", y: 62, d: 0.27 },
        { id: "#f04e-card-4", y: 56, d: 0.26 }
      ];
      for (var c = 0; c < cards.length; c++) {
        var ct = 2.6 + c * 0.12;
        tl.set(cards[c].id, { opacity: 1, y: cards[c].y }, ct);
        tl.to(cards[c].id, { y: 0, duration: cards[c].d, ease: "power4.out" }, ct);
      }

      /* counting-dynamic-scale — 1.2s, escala 1→1.06→1 al llegar */
      var COUNT_DUR = 1.2;
      var COUNT_EASE = "power3.out";
      var stats = [
        { el: "#f04e-num-1", target: 53694, dp: -1, at: 2.74 },
        { el: "#f04e-num-2", target: 168629, dp: -1, at: 2.92 },
        { el: "#f04e-num-3", target: 106408, dp: -1, at: 3.1 },
        { el: "#f04e-num-4", target: 91.98, dp: 2, at: 3.28 }
      ];
      stats.forEach(function (s) {
        var node = q(s.el);
        if (!node) return;
        var state = { v: 0 };
        var dp = s.dp;
        tl.to(
          state,
          {
            v: s.target,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: function () {
              node.textContent = dp < 0 ? miles(state.v) : dec(state.v, dp);
            }
          },
          s.at
        );
        /* crecimiento visual: mismo timing y ease que el valor */
        tl.fromTo(node, { scale: 0.9 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, s.at);
        /* pequeño acento al aterrizar: 1 → 1.06 → 1 */
        tl.to(node, { scale: 1.06, duration: 0.12, ease: "power2.out" }, s.at + COUNT_DUR);
        tl.to(node, { scale: 1, duration: 0.26, ease: "power2.out" }, s.at + COUNT_DUR + 0.12);
      });

      /* sufijo % — entra DESPUÉS de que el número aterriza */
      tl.fromTo(
        "#f04e-suffix",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.4)" },
        3.28 + COUNT_DUR
      );

      /* ── Scene 4 (5.2–7.6s) — tabla de rendimiento + barras (stat-bars-and-fills) ── */
      tl.fromTo(
        "#f04e-table",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.2
      );

      var rows = [
        { row: "#f04e-row-1", fill: "#f04e-fill-1", pct: "#f04e-pct-1", v: 97.4 },
        { row: "#f04e-row-2", fill: "#f04e-fill-2", pct: "#f04e-pct-2", v: 94.1 },
        { row: "#f04e-row-3", fill: "#f04e-fill-3", pct: "#f04e-pct-3", v: 91.6 },
        { row: "#f04e-row-4", fill: "#f04e-fill-4", pct: "#f04e-pct-4", v: 88.3 }
      ];
      var FILL_DUR = 0.9;
      var FILL_EASE = "power2.out";
      rows.forEach(function (r, i) {
        var rt = 5.5 + i * 0.12;
        tl.set(r.row, { opacity: 1, y: 26 }, rt);
        tl.to(r.row, { y: 0, duration: 0.24, ease: "power4.out" }, rt);

        var ft = rt + 0.18;
        tl.fromTo(
          r.fill,
          { scaleX: 0 },
          { scaleX: r.v / 100, duration: FILL_DUR, ease: FILL_EASE },
          ft
        );

        /* el número y la barra aterrizan como un solo golpe */
        var pnode = q(r.pct);
        if (!pnode) return;
        var pstate = { v: 0 };
        tl.to(
          pstate,
          {
            v: r.v,
            duration: FILL_DUR,
            ease: FILL_EASE,
            onUpdate: function () {
              pnode.textContent = dec(pstate.v, 1);
            }
          },
          ft
        );
      });

      /* ── Scene 5 (7.6–10.0s) — apoyo discreto, luego quieto ── */
      tl.fromTo(
        "#f04e-note",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        7.7
      );

      /* fija la duración exacta del plano */
      tl.to({}, { duration: 0.1 }, 9.9);

      window.__timelines["04-estadisticas"] = tl;
    })();
