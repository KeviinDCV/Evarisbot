<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; background: #f0f2f8; }
    a { color: #2e3f84; } a:hover { color: #24316a; }
    .fila { display: flex; align-items: stretch; gap: 12px; padding-left: 12px; cursor: pointer; transition: background-color .12s; position: relative }
    .fila:hover { background: #f5f6fa; }
    .av { width: 48px; height: 48px; border-radius: 9999px; background: linear-gradient(to bottom right, #4e5fa4, #3e4f94);
          color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 10px; position: relative }
    .marca { position: absolute; left: -12px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0 }
    .cuerpo { flex: 1; min-width: 0; padding: 10px 12px 10px 0; border-bottom: 1px solid #ececf3; }
    .lin1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; }
    .izq { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 }
    .nom { font-weight: 700; font-size: 15px; color: #1a1c1c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hora { font-size: 11px; color: #767681; flex-shrink: 0; }
    .prev { font-size: 13px; color: #5f5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { min-width: 20px; height: 20px; border-radius: 9999px; background: #2e3f84; color: #fff; font-size: 11px;
             font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .02em; border-radius: 5px; padding: 1px 6px; white-space: nowrap; flex-shrink: 0 }
    .mas { font-size: 10px; font-weight: 600; color: #767681; flex-shrink: 0 }
  </style>
</helmet>

<div style="width: 380px; background: #ffffff; height: 620px; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 20px; font-weight: 700; color: #1c1f2e">Conversaciones</div>
    <div style="display: flex; align-items: center; gap: 8px; background: #eef0f6; border-radius: 12px; padding: 9px 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5c6485" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <span style="font-size: 13px; color: #5c6485">Buscar conversación...</span>
    </div>
    <div style="display: flex; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; color: #ffffff; background: #2e3f84; border-radius: 9999px; padding: 5px 12px">Todos</span>
      <span style="font-size: 12px; font-weight: 600; color: #5c6485; background: #eef0f6; border-radius: 9999px; padding: 5px 12px">No leídos 735</span>
      <span style="font-size: 12px; font-weight: 600; color: #5c6485; background: #eef0f6; border-radius: 9999px; padding: 5px 12px">En espera 20</span>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden">
    <sc-for list="{{filas}}" as="f" hint-placeholder-count="7">
      <div class="fila">
        <sc-if value="{{f.tieneTags}}" hint-placeholder-val="{{ true }}">
          <span class="marca" style="{{f.marca}}"></span>
        </sc-if>
        <div class="av">{{f.inicial}}</div>
        <div class="cuerpo">
          <div class="lin1">
            <div class="izq">
              <span class="nom">{{f.nombre}}</span>
              <sc-if value="{{f.tieneTags}}" hint-placeholder-val="{{ true }}">
                <span class="chip" style="{{f.chipEstilo}}">{{f.chipTexto}}</span>
              </sc-if>
              <sc-if value="{{f.resto}}" hint-placeholder-val="{{ true }}">
                <span class="mas">{{f.resto}}</span>
              </sc-if>
            </div>
            <span class="hora">{{f.hora}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <span class="prev">{{f.mensaje}}</span>
            <sc-if value="{{f.sinLeer}}" hint-placeholder-val="{{ true }}">
              <span class="badge">{{f.sinLeer}}</span>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":380,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    // Solo la etiqueta principal cabe junto al nombre; el resto se resume en "+N".
    // La franja del borde izquierdo repite su color, de modo que el ojo agrupa
    // por color al recorrer la lista sin necesidad de leer.
    const T = {
      agendado:  { texto: 'AGENDADO',  bg: '#fef3c7', fg: '#92400e', pt: '#f59e0b' },
      aic:       { texto: 'AIC',       bg: '#fef3c7', fg: '#92400e', pt: '#f59e0b' },
      arl:       { texto: 'ARL',       bg: '#fee2e2', fg: '#991b1b', pt: '#e5484d' },
      asmet:     { texto: 'ASMET',     bg: '#d1fae5', fg: '#065f46', pt: '#10b981' },
      oncologia: { texto: 'ONCOLOGÍA', bg: '#e8ebf5', fg: '#2e3f84', pt: '#2e3f84' },
      nuevaeps:  { texto: 'NUEVA EPS', bg: '#e0e7ff', fg: '#3730a3', pt: '#6366f1' },
    };
    const filas = [
      { inicial: 'M', nombre: 'María Fernanda Ocampo', hora: '14:32', mensaje: 'Buenos días, quisiera saber si mi cita sigue en pie', sinLeer: 2, tags: ['agendado', 'asmet'] },
      { inicial: 'J', nombre: 'Jorge H. Pejendino', hora: '14:18', mensaje: 'Confirmar', sinLeer: 1, tags: ['oncologia'] },
      { inicial: 'L', nombre: 'Luz Marina Caicedo', hora: '13:47', mensaje: 'Muchas gracias por la información', sinLeer: 0, tags: [] },
      { inicial: 'C', nombre: 'Carlos Armando Mira', hora: '12:05', mensaje: 'Tú: Le confirmamos su cita para el 26 de agosto', sinLeer: 0, tags: ['agendado', 'nuevaeps'] },
      { inicial: 'A', nombre: 'Ana Milena Truyo', hora: '11:22', mensaje: 'Necesito reprogramar, no puedo asistir', sinLeer: 3, tags: ['arl'] },
      { inicial: 'E', nombre: 'Elizabeth Castillo', hora: '10:58', mensaje: 'Cancelar', sinLeer: 0, tags: ['aic'] },
      { inicial: 'V', nombre: 'Víctor Manuel Ortiz', hora: '09:41', mensaje: 'Tú: ¡Muchas gracias!', sinLeer: 0, tags: ['oncologia', 'agendado'] },
    ];
    return {
      filas: filas.map((f) => {
        const p = f.tags[0] ? T[f.tags[0]] : null;
        return {
          ...f,
          tieneTags: !!p,
          chipTexto: p ? p.texto : '',
          chipEstilo: p ? 'background:' + p.bg + ';color:' + p.fg : '',
          marca: p ? 'background:' + p.pt : '',
          resto: f.tags.length > 1 ? '+' + (f.tags.length - 1) : 0,
        };
      }),
    };
  }
}
</script>
</body>
</html>
